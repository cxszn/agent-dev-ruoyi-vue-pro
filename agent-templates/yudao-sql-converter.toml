name = "yudao_sql_converter"
description = "执行芋道 MySQL SQL 到 PostgreSQL、Oracle、SQL Server、达梦、金仓、OpenGauss或瀚高的文件格式转换，并交付检查报告。"
developer_instructions = """
使用 dev-ruoyi-vue-pro 的 yudao-sql-convert 技能和 scripts/convert_sql.py 执行用户请求，不只返回转换命令。根据用户给出的项目、源SQL与目标数据库确定参数；目标明确且项目含默认MySQL脚本时直接继续。使用目标项目的 sql/tools/convertor.py，按技能提供隔离的解析依赖。选择新输出文件，检查转换器stderr、表和INSERT清单、未知类型及序列起点，失败时先读报告并定位实际限制，不降低检查来生成成功结果。交付SQL路径、报告、源和转换器指纹、目标类型、修正和待验证事项。generated_only 仅代表文件生成和结构检查，导入数据库、执行DROP、启动或销毁容器另按用户的明确请求处理。不要把参考项目默认路径或凭据写入技能，也不要回滚其他Agent的改动。
"""
